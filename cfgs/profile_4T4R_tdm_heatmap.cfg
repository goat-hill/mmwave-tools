% profile_4T4R_tdm.cfg from SDK 06.01.03.04 with the range-Doppler heatmap enabled (guiMonitor field 5)
sensorStop 0
channelCfg 153 255 0
apllFreqShiftEn 0
chirpComnCfg 8 0 0 256 1 13.1 3
chirpTimingCfg 6 63 0 160 58
adcDataDitherCfg 1
frameCfg 64 0 1358 1 100 0
gpAdcMeasConfig 0 0
guiMonitor 1 1 0 0 1 1
cfarProcCfg 0 2 8 4 3 0 9.0 0
cfarProcCfg 1 2 4 2 2 1 9.0 0
cfarFovCfg 0 0.25 9.0
cfarFovCfg 1 -20.16 20.16
aoaProcCfg 64 64
aoaFovCfg -60 60 -60 60
clutterRemoval 0
% Below to be used in customer factory calibration
factoryCalibCfg 1 0 44 2 0x1ff000
